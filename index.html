<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mongolian Geospatial Association | MGA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #f5f7fa;
      --bg2:      #eef1f6;
      --surface:  #ffffff;
      --surface2: #f0f4f9;
      --border:   #d4dce8;
      --border2:  #b8c6d8;
      --navy:     #0d2a4a;
      --blue:     #1a4a7a;
      --accent:   #0077aa;
      --accent2:  #005580;
      --glow:     rgba(0,119,170,0.1);
      --gold:     #b07a10;
      --gold2:    #d4960a;
      --gold-bg:  #fdf3dc;
      --white:    #ffffff;
      --text:     #1a2e42;
      --muted:    #5a7590;
      --muted2:   #8aa0b4;
      --sky:      #7dd8f8;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'IBM Plex Sans', sans-serif;
      --font-mono:    'IBM Plex Mono', monospace;

      --session1:   #eef6fb;
      --session2:   #edf7f1;
      --break-bg:   #fdf8ee;
      --closing-bg: #f5eef8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(0,100,160,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2.5rem;
      height: 60px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 12px rgba(0,40,80,0.06);
    }
    .nav-logo {
      font-family: var(--font-mono);
      font-weight: 600; font-size: 1.05rem;
      color: var(--accent);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .nav-logo::before { content: '[ '; color: var(--muted2); }
    .nav-logo::after  { content: ' ]'; color: var(--muted2); }
    .nav-links { display: flex; gap: 0.1rem; align-items: center; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none; font-size: 0.75rem;
      font-weight: 500; padding: 0.35rem 0.8rem;
      border-radius: 3px; transition: all 0.2s;
      letter-spacing: 0.06em; text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .nav-links a:hover { color: var(--accent); background: var(--glow); }
    .nav-links a.highlight {
      background: var(--gold-bg); color: var(--gold);
      border: 1px solid rgba(176,122,16,0.25);
    }
    .nav-links a.highlight:hover { background: #fdeec8; }
    .lang-toggle {
      color: var(--muted2); font-size: 0.72rem; font-weight: 600;
      margin-left: 0.5rem; cursor: pointer; letter-spacing: 0.08em;
      font-family: var(--font-mono);
    }

    /* ── HERO ── */
    #home {
      padding-top: 60px;
      background: linear-gradient(160deg, var(--navy) 0%, var(--blue) 55%, #1d6a8a 100%);
      min-height: 88vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      position: relative; overflow: hidden;
    }
    #home::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, rgba(100,200,240,0.12) 0%, transparent 70%),
        radial-gradient(circle at 10% 80%, rgba(255,255,255,0.05) 0%, transparent 40%);
    }
    #home::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 80%);
    }
    .hero-inner {
      position: relative; z-index: 1; max-width: 820px; padding: 3rem 2rem;
      animation: fadeUp 0.9s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-eyebrow {
      font-family: var(--font-mono); font-size: 0.7rem;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(180,220,255,0.8); margin-bottom: 1.2rem;
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
    }
    .hero-eyebrow::before, .hero-eyebrow::after {
      content: ''; flex: 1; max-width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(180,220,255,0.5));
    }
    .hero-eyebrow::after { background: linear-gradient(90deg, rgba(180,220,255,0.5), transparent); }
    .hero-inner h1 {
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(2.8rem, 6vw, 5rem);
      color: #ffffff; line-height: 1.1;
      margin-bottom: 0.5rem; letter-spacing: -0.01em;
    }
    .hero-inner h1 span { color: var(--sky); font-style: italic; }
    .hero-mn {
      font-size: 0.95rem; color: rgba(200,225,255,0.65);
      margin-bottom: 1.75rem; letter-spacing: 0.03em;
    }
    .hero-inner > p {
      font-size: 1.05rem; color: rgba(220,235,255,0.88);
      margin-bottom: 2.5rem; max-width: 600px;
      margin-left: auto; margin-right: auto;
    }
    .hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

    /* ── BUTTONS ── */
    .btn {
      padding: 0.7rem 2rem; border-radius: 4px; font-weight: 500;
      font-size: 0.8rem; text-decoration: none; transition: all 0.22s;
      display: inline-block; letter-spacing: 0.08em; text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .btn-primary { background: var(--sky); color: var(--navy); }
    .btn-primary:hover { background: #a0e4ff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    .btn-outline { border: 1px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.9); }
    .btn-outline:hover { border-color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.1); }
    .btn-teal { background: var(--accent); color: #fff; }
    .btn-teal:hover { background: var(--accent2); transform: translateY(-2px); }
    .btn-navy {
      background: var(--navy); color: #fff;
      border: 1px solid transparent;
    }
    .btn-navy:hover { background: var(--blue); transform: translateY(-2px); }

    /* ── STATS ── */
    .stats {
      background: var(--surface);
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(0,40,80,0.06);
      position: relative; z-index: 1;
    }
    .stat {
      padding: 2rem 1rem; text-align: center;
      border-right: 1px solid var(--border);
      transition: background 0.2s;
    }
    .stat:hover { background: var(--surface2); }
    .stat:last-child { border-right: none; }
    .stat-num {
      font-family: var(--font-mono); font-size: 2.4rem;
      font-weight: 600; color: var(--accent); line-height: 1;
    }
    .stat-label { font-size: 0.76rem; color: var(--muted); margin-top: 0.4rem; letter-spacing: 0.03em; }

    /* ── SECTIONS ── */
    section { padding: 5.5rem 2rem; position: relative; z-index: 1; }
    .container { max-width: 1100px; margin: 0 auto; }
    .section-header { text-align: center; margin-bottom: 3.5rem; }
    .section-header h2 {
      font-family: var(--font-display); font-size: 2.6rem;
      font-weight: 700; color: var(--navy); margin-bottom: 0.3rem;
      letter-spacing: -0.01em;
    }
    .section-header .sub {
      font-size: 0.82rem; color: var(--muted);
      font-family: var(--font-mono); letter-spacing: 0.06em;
    }
    .divider {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--gold2));
      margin: 0.8rem auto 0;
    }

    /* ── FOCUS AREAS ── */
    #about { background: var(--bg2); }
    .focus-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    .focus-card {
      background: var(--surface); border-radius: 6px;
      padding: 1.75rem; border: 1px solid var(--border);
      border-top: 3px solid transparent;
      transition: all 0.25s; position: relative; overflow: hidden;
    }
    .focus-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--gold2));
      transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease;
    }
    .focus-card:hover::before { transform: scaleX(1); }
    .focus-card:hover {
      border-color: var(--border2);
      box-shadow: 0 8px 32px rgba(0,40,100,0.1);
      transform: translateY(-3px);
    }
    .focus-icon { font-size: 1.75rem; margin-bottom: 0.85rem; }
    .focus-card h3 {
      font-family: var(--font-display); font-weight: 700;
      font-size: 1.2rem; color: var(--navy); margin-bottom: 0.2rem;
    }
    .focus-card .mn {
      font-size: 0.72rem; color: var(--accent); margin-bottom: 0.65rem;
      font-family: var(--font-mono); letter-spacing: 0.04em;
    }
    .focus-card p { font-size: 0.87rem; color: var(--muted); line-height: 1.6; }

    /* ── TRAINING ── */
    #training { background: var(--surface); }
    .training-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
    .training-list { list-style: none; }
    .training-list li {
      padding: 0.8rem 0 0.8rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem; color: var(--text);
      position: relative;
    }
    .training-list li::before {
      content: '▸';
      position: absolute; left: 0; top: 0.9rem;
      color: var(--accent); font-size: 0.7rem;
    }
    .enroll-box {
      background: linear-gradient(140deg, var(--navy) 0%, var(--blue) 100%);
      border-radius: 8px; padding: 2.5rem; color: #fff; text-align: center;
      position: relative; overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,40,100,0.18);
    }
    .enroll-box::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(120,210,255,0.15), transparent 65%);
      pointer-events: none;
    }
    .enroll-box h3 {
      font-family: var(--font-display); font-size: 1.7rem;
      font-weight: 700; margin-bottom: 0.6rem;
    }
    .enroll-box p { font-size: 0.88rem; opacity: 0.8; margin-bottom: 1.75rem; }

    /* ── MEMBERSHIP ── */
    #membership { background: var(--bg2); }
    .member-types {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem; margin-bottom: 3rem;
    }
    .member-type-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 1.25rem; text-align: center;
      transition: all 0.25s;
    }
    .member-type-card:hover {
      border-color: var(--accent); transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,40,100,0.1);
    }
    .member-type-card .icon { font-size: 1.75rem; margin-bottom: 0.5rem; }
    .member-type-card h4 {
      font-family: var(--font-display); font-size: 1.1rem;
      color: var(--navy); margin-bottom: 0.15rem;
    }
    .member-type-card .mn {
      font-size: 0.7rem; color: var(--accent);
      font-family: var(--font-mono); letter-spacing: 0.04em;
    }

    .member-form-wrap {
      max-width: 720px; margin: 0 auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0,40,100,0.08);
    }
    .member-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .member-form .full { grid-column: 1 / -1; }
    .member-form label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--navy); margin-bottom: 0.35rem;
      font-family: var(--font-mono); letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .member-form label .req { color: #c0392b; }
    .member-form input, .member-form select, .member-form textarea {
      width: 100%; padding: 0.7rem 0.9rem;
      border: 1px solid var(--border); border-radius: 4px;
      font-family: var(--font-body); font-size: 0.9rem;
      color: var(--text); background: var(--surface2);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .member-form input:focus, .member-form select:focus, .member-form textarea:focus {
      outline: none; border-color: var(--accent); background: #fff;
      box-shadow: 0 0 0 3px rgba(0,119,170,0.1);
    }
    .member-form textarea { resize: vertical; min-height: 100px; }
    .member-form .submit-row { grid-column: 1 / -1; text-align: center; margin-top: 0.5rem; }
    .member-form button {
      border: none; cursor: pointer;
      font-family: var(--font-mono);
    }
    #mf-status {
      grid-column: 1 / -1; text-align: center;
      font-family: var(--font-mono); font-size: 0.8rem;
      padding-top: 0.5rem; display: none;
    }

    /* ── WORKSHOP ── */
    #workshop { background: var(--surface); }
    .workshop-hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 55%, #1d6a8a 100%);
      border-radius: 8px; padding: 2.5rem; color: #fff;
      margin-bottom: 2.5rem; position: relative; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,40,100,0.18);
    }
    .workshop-hero::before {
      content: '🛰️';
      position: absolute; right: 2rem; top: 50%; transform: translateY(-50%);
      font-size: 6rem; opacity: 0.1;
    }
    .workshop-hero::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .ws-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(212,150,10,0.18); color: #f0c84a;
      font-size: 0.7rem; font-weight: 600; padding: 0.25rem 0.75rem;
      border-radius: 2px; letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 1rem; font-family: var(--font-mono);
      border: 1px solid rgba(212,150,10,0.3);
    }
    .ws-badge::before { content: '●'; font-size: 0.55rem; color: #f0c84a; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .workshop-hero h3 {
      font-family: var(--font-display); font-size: 1.85rem;
      font-weight: 700; margin-bottom: 1.25rem; line-height: 1.25; color: #fff;
    }
    .ws-meta { display: flex; flex-wrap: wrap; gap: 2rem; }
    .ws-meta-item { display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.88rem; }
    .ws-meta-item .icon { font-size: 1rem; margin-top: 0.1rem; }
    .ws-meta-item strong {
      display: block; font-weight: 600; color: var(--sky);
      font-family: var(--font-mono); font-size: 0.7rem;
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.15rem;
    }
    .ws-meta-item span { color: rgba(220,235,255,0.88); }

    .agenda-title {
      font-family: var(--font-mono); font-size: 0.76rem; font-weight: 600;
      color: var(--accent); margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 0.8rem;
      text-transform: uppercase; letter-spacing: 0.12em;
    }
    .agenda-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .agenda-table {
      width: 100%; border-collapse: collapse;
      background: var(--surface); border-radius: 6px;
      overflow: hidden; border: 1px solid var(--border);
      box-shadow: 0 2px 20px rgba(0,40,100,0.07);
      margin-bottom: 2rem; font-size: 0.88rem;
    }
    .agenda-table thead tr { background: var(--navy); color: #fff; }
    .agenda-table thead th {
      padding: 0.9rem 1.25rem; text-align: left;
      font-family: var(--font-mono); font-weight: 600; font-size: 0.72rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: #a8d4ee;
    }
    .agenda-table tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
    .agenda-table tbody tr:last-child { border-bottom: none; }
    .agenda-table tbody tr:hover { background: var(--surface2); }
    .agenda-table tbody td { padding: 0.9rem 1.25rem; vertical-align: top; }
    .time-cell {
      white-space: nowrap; font-weight: 500; color: var(--accent);
      font-size: 0.78rem; font-family: var(--font-mono);
      width: 145px; letter-spacing: 0.03em;
    }

    tr.row-break        { background: var(--break-bg); }
    tr.row-break .time-cell { color: var(--gold); }
    tr.row-lunch        { background: #eef7f0; }
    tr.row-lunch .time-cell { color: #2d7a50; }
    tr.row-opening      { background: #f0f6fc; }
    tr.row-mou          { background: #f7f0fc; }
    tr.row-keynote      { background: #eaf5fb; }
    tr.row-s1           { background: var(--session1); }
    tr.row-s2           { background: var(--session2); }
    tr.row-closing      { background: var(--closing-bg); }
    tr.row-registration { background: #fafbfc; }

    .row-label {
      display: inline-block; font-size: 0.63rem; font-weight: 600;
      padding: 0.12rem 0.55rem; border-radius: 3px;
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 0.35rem; font-family: var(--font-mono);
    }
    .label-opening  { background: #dbeeff; color: #1a4a7a; }
    .label-keynote  { background: #cce8f4; color: #0d5a7a; }
    .label-session  { background: #d0f0e0; color: #1a6040; }
    .label-closing  { background: #e8d8f5; color: #5a2880; }
    .label-mou      { background: #f0d8f8; color: #6a2080; }
    .label-break    { background: #fde8c0; color: #7a4c00; }
    .label-lunch    { background: #d0eedd; color: #1a5a34; }
    .label-reg      { background: #e8ecf0; color: #4a6070; }

    .event-title { font-weight: 600; color: var(--navy); margin-bottom: 0.3rem; font-size: 0.9rem; }
    .presenter { color: var(--muted); font-size: 0.82rem; line-height: 1.55; font-style: italic; }
    .presenter strong { font-style: normal; color: var(--text); font-weight: 600; }

    .speakers-list { list-style: none; margin-top: 0.25rem; }
    .speakers-list li {
      padding: 0.5rem 0; border-bottom: 1px solid var(--border);
      font-size: 0.86rem; line-height: 1.55;
    }
    .speakers-list li:last-child { border-bottom: none; }
    .speakers-list .talk { font-weight: 600; color: var(--navy); display: block; margin-bottom: 0.1rem; }
    .speakers-list .who { color: var(--muted); font-style: italic; font-size: 0.8rem; }

    .mou-note {
      background: #f5eeff; border-left: 3px solid #b080d8;
      padding: 0.6rem 1rem; border-radius: 0 4px 4px 0;
      font-size: 0.86rem; color: var(--muted);
    }

    .register-strip {
      background: var(--gold-bg);
      border: 1px solid rgba(176,122,16,0.25);
      border-left: 3px solid var(--gold2);
      border-radius: 6px;
      padding: 1.5rem 2rem; display: flex;
      align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem; margin-top: 1.5rem;
    }
    .register-strip h4 {
      font-family: var(--font-display); font-size: 1.2rem;
      font-weight: 700; color: var(--navy);
    }
    .register-strip p { font-size: 0.82rem; color: var(--muted); margin-top: 0.15rem; }

    /* ── CONTACT ── */
    #contact { background: var(--navy); color: #fff; }
    #contact .section-header h2 { color: #fff; }
    #contact .section-header .sub { color: rgba(180,210,240,0.6); }
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; }
    .contact-info h3 {
      font-family: var(--font-mono); font-size: 0.75rem;
      font-weight: 600; color: var(--sky); margin-bottom: 1.5rem;
      text-transform: uppercase; letter-spacing: 0.12em;
    }
    .contact-item { display: flex; gap: 0.85rem; margin-bottom: 1.25rem; align-items: flex-start; }
    .contact-item .ci-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 0.15rem; }
    .contact-item .ci-text { font-size: 0.88rem; color: rgba(200,225,245,0.85); }
    .contact-item .ci-text strong {
      display: block; color: var(--sky);
      font-family: var(--font-mono); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.2rem;
    }
